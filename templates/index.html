<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Config Panel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🦞 OpenClaw Config Panel</h1>
            <div class="header-actions">
                <span id="service-status" class="status-badge">检测中...</span>
                <button onclick="restartService()" class="btn btn-sm">重启服务</button>
                <button onclick="backupConfig()" class="btn btn-sm btn-secondary">备份配置</button>
            </div>
        </header>

        <main>
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab" data-tab="agents">Agent 管理</button>
                <button class="tab active" data-tab="bots">Bot 账号管理</button>
                <button class="tab" data-tab="bindings">Agent 绑定路由</button>
                <button class="tab" data-tab="info">配置概览</button>
            </div>

            <!-- Tab: Agents -->
            <div id="tab-agents" class="tab-content">
                <div class="section-header">
                    <h2>Agent 列表</h2>
                    <button onclick="showAddAgentModal()" class="btn btn-primary">+ 创建 Agent</button>
                </div>

                <div id="agent-list" class="card-grid">
                    <!-- Agent cards rendered here by JS -->
                </div>
            </div>

            <!-- Tab: Bots -->
            <div id="tab-bots" class="tab-content active">
                <div class="section-header">
                    <h2>飞书 Bot 账号</h2>
                    <button onclick="showAddBotModal()" class="btn btn-primary">+ 添加 Bot</button>
                </div>

                <div id="bot-list" class="card-grid">
                    <!-- Bot cards rendered here by JS -->
                </div>
            </div>

            <!-- Tab: Bindings -->
            <div id="tab-bindings" class="tab-content">
                <div class="section-header">
                    <h2>Agent → Bot 绑定路由</h2>
                    <button onclick="showAddBindingModal()" class="btn btn-primary">+ 添加绑定</button>
                </div>

                <div id="binding-list" class="binding-list">
                    <!-- Bindings rendered here by JS -->
                </div>
            </div>

            <!-- Tab: Info -->
            <div id="tab-info" class="tab-content">
                <div class="section-header">
                    <h2>配置概览</h2>
                </div>

                <div class="info-section">
                    <h3>模型配置</h3>
                    <div id="model-info" class="info-box">
                        <!-- Models rendered here by JS -->
                    </div>
                </div>

                <div class="info-section">
                    <h3>Agent 工作区</h3>
                    <div id="agent-info" class="info-box">
                        <!-- Agents rendered here by JS -->
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>OpenClaw Config Panel · 配置文件: ~/.openclaw/openclaw.json</p>
        </footer>
    </div>

    <!-- Modal: Add/Edit Bot -->
    <div id="bot-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="bot-modal-title">添加 Bot</h3>
                <button onclick="closeBotModal()" class="close">&times;</button>
            </div>
            <form id="bot-form">
                <input type="hidden" id="bot-name-original">
                <div class="form-group">
                    <label>Bot 名称（唯一标识）</label>
                    <input type="text" id="bot-name" placeholder="例如: my-agent-bot" required>
                </div>
                <div class="form-group">
                    <label>App ID</label>
                    <input type="text" id="bot-appId" placeholder="cli_xxxxxxxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label>App Secret</label>
                    <input type="password" id="bot-appSecret" placeholder="填写后自动保存" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>dmPolicy（私聊策略）</label>
                        <select id="bot-dmPolicy">
                            <option value="open">open - 任何人可私聊</option>
                            <option value="pairing">pairing - 需配对码</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>groupPolicy（群聊策略）</label>
                        <select id="bot-groupPolicy">
                            <option value="closed">closed - 需明确允许</option>
                            <option value="open">open - 所有人可用</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>webhookPath</label>
                    <input type="text" id="bot-webhookPath" value="/feishu/events">
                </div>
                <div class="form-actions">
                    <button type="button" onclick="closeBotModal()" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add/Edit Agent -->
    <div id="agent-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="agent-modal-title">创建 Agent</h3>
                <button onclick="closeAgentModal()" class="close">&times;</button>
            </div>
            <form id="agent-form">
                <input type="hidden" id="agent-id-original">
                <div class="form-group">
                    <label>Agent ID（唯一标识，创建后不可修改，用于路由绑定和会话管理）</label>
                    <input type="text" id="agent-id" placeholder="例如: support-bot" required>
                    <span class="form-hint">只允许英文字母、数字、连字符和下划线</span>
                </div>
                <div class="form-group">
                    <label>显示名称</label>
                    <input type="text" id="agent-name" placeholder="例如: 客服助手">
                </div>
                <div class="form-group">
                    <label>工作区路径</label>
                    <div class="input-with-preview">
                        <input type="text" id="agent-workspace" placeholder="自动生成，也可自定义">
                        <span id="workspace-preview" class="form-hint">~/.openclaw/agents/&lt;agent-id&gt;/</span>
                    </div>
                    <span class="form-hint">留空自动按规则生成：~/.openclaw/agents/&lt;agent-id&gt;/</span>
                </div>
                <div class="form-group">
                    <label>模型</label>
                    <select id="agent-model">
                        <option value="">使用默认模型</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" onclick="closeAgentModal()" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Edit Agent Core Files -->
    <div id="files-modal" class="modal modal-wide">
        <div class="modal-content modal-content-wide">
            <div class="modal-header">
                <h3 id="files-modal-title">编辑核心文件</h3>
                <button onclick="closeFilesModal()" class="close">&times;</button>
            </div>
            <div class="file-tabs" id="file-tabs">
                <!-- File tabs rendered by JS -->
            </div>
            <div class="file-editor-wrapper">
                <div class="file-editor-header">
                    <span id="file-desc" class="file-desc"></span>
                    <span id="file-status" class="file-status"></span>
                </div>
                <textarea id="file-editor" class="file-editor" spellcheck="false" placeholder="文件内容为空，点击此处开始编辑..."></textarea>
            </div>
            <div class="form-actions">
                <button type="button" onclick="closeFilesModal()" class="btn btn-secondary">关闭</button>
                <button type="button" onclick="loadTemplate()" class="btn btn-secondary">📋 加载模板</button>
                <button type="button" onclick="saveCurrentFile()" class="btn btn-primary">保存当前文件</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add Binding -->
    <div id="binding-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加 Agent → Bot 绑定</h3>
                <button onclick="closeBindingModal()" class="close">&times;</button>
            </div>
            <form id="binding-form">
                <div class="form-group">
                    <label>Agent ID</label>
                    <select id="binding-agentId">
                        <option value="">选择 Agent...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>绑定到 Bot（accountId）</label>
                    <select id="binding-accountId">
                        <option value="">选择 Bot...</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" onclick="closeBindingModal()" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script>
        // ---- Data from server ----
        const bots = {{ bots | tojson }};
        const bindings = {{ bindings | tojson }};
        const agents = {{ agents | tojson }};
        const models = {{ models | tojson }};
        const serviceOk = {{ 'true' if service_ok else 'false' }};

        // ---- Init ----
        document.addEventListener('DOMContentLoaded', () => {
            renderServiceStatus();
            renderAgents();
            renderBots();
            renderBindings();
            renderInfo();
            initTabs();
            initBotForm();
            initAgentForm();
            initBindingForm();
        });

        // ---- Service Status ----
        function renderServiceStatus() {
            const el = document.getElementById('service-status');
            if (serviceOk) {
                el.textContent = '● 运行中';
                el.className = 'status-badge status-ok';
            } else {
                el.textContent = '○ 已停止';
                el.className = 'status-badge status-error';
            }
        }

        async function restartService() {
            showToast('正在重启服务...', 'info');
            try {
                const res = await fetch('/api/service/restart', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast('服务已重启', 'success');
                    setTimeout(() => location.reload(), 1500);
                } else {
                    showToast('重启失败: ' + data.error, 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        async function backupConfig() {
            try {
                const res = await fetch('/api/backup', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast('备份已保存', 'success');
                }
            } catch (e) {
                showToast('备份失败: ' + e.message, 'error');
            }
        }

        // ---- Agent List ----
        function renderAgents() {
            const container = document.getElementById('agent-list');
            if (!agents.list || agents.list.length === 0) {
                container.innerHTML = '<p class="empty-state">暂无 Agent</p>';
                return;
            }

            container.innerHTML = agents.list.map(agent => {
                const isDefault = agent.isDefault;
                return `
                <div class="card ${isDefault ? 'card-default' : ''}">
                    <div class="card-header">
                        <h3>${escapeHtml(agent.name || agent.id)}</h3>
                        <div>
                            <code class="agent-id">${escapeHtml(agent.id)}</code>
                            ${isDefault ? '<span class="badge badge-ok">默认</span>' : ''}
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="info-row">
                            <span class="label">ID:</span>
                            <code>${escapeHtml(agent.id)}</code>
                        </div>
                        <div class="info-row">
                            <span class="label">工作区:</span>
                            <code>${escapeHtml(agent.workspace || agents.defaults.workspace || '未配置')}</code>
                        </div>
                        <div class="info-row">
                            <span class="label">模型:</span>
                            <code>${escapeHtml(agent.model || agents.defaults.model?.primary || '未配置')}</code>
                        </div>
                    </div>
                    ${isDefault ? '' : `
                    <div class="card-actions">
                        <button onclick="editAgentFiles('${escapeJs(agent.id)}')" class="btn btn-sm btn-primary">编辑核心文件</button>
                        <button onclick="editAgent('${escapeJs(agent.id)}')" class="btn btn-sm">编辑配置</button>
                        <button onclick="deleteAgent('${escapeJs(agent.id)}')" class="btn btn-sm btn-danger">删除</button>
                    </div>`}
                    ${isDefault ? `
                    <div class="card-actions">
                        <button onclick="editAgentFiles('${escapeJs(agent.id)}')" class="btn btn-sm btn-primary">编辑核心文件</button>
                    </div>` : ''}
                </div>
                `;
            }).join('');
        }

        // ---- Agent Modal ----
        function showAddAgentModal() {
            document.getElementById('agent-modal-title').textContent = '创建 Agent';
            document.getElementById('agent-form').reset();
            document.getElementById('agent-id-original').value = '';
            document.getElementById('agent-id').disabled = false;
            document.getElementById('agent-id').required = true;
            document.getElementById('workspace-preview').textContent = '~/.openclaw/agents/<agent-id>/';

            // 填充模型选项
            populateModelSelect();

            document.getElementById('agent-modal').style.display = 'flex';
        }

        function editAgent(agentId) {
            const agent = agents.list.find(a => a.id === agentId);
            if (!agent || agent.isDefault) return;

            document.getElementById('agent-modal-title').textContent = '编辑 Agent';
            document.getElementById('agent-id-original').value = agentId;
            document.getElementById('agent-id').value = agentId;
            document.getElementById('agent-id').disabled = true;
            document.getElementById('agent-id').required = false;
            document.getElementById('agent-name').value = (agent.name && !agent.name.includes('(默认)')) ? agent.name : '';
            document.getElementById('agent-workspace').value = agent.workspace || '';

            populateModelSelect();
            const currentModel = agent.model || '';
            if (currentModel) {
                const sel = document.getElementById('agent-model');
                // 检查是否在列表中
                let found = false;
                for (let i = 0; i < sel.options.length; i++) {
                    if (sel.options[i].value === currentModel) { found = true; break; }
                }
                if (!found) {
                    const opt = document.createElement('option');
                    opt.value = currentModel;
                    opt.textContent = currentModel;
                    sel.appendChild(opt);
                }
                sel.value = currentModel;
            }

            document.getElementById('agent-modal').style.display = 'flex';
        }

        function closeAgentModal() {
            document.getElementById('agent-modal').style.display = 'none';
        }

        function populateModelSelect() {
            const sel = document.getElementById('agent-model');
            sel.innerHTML = '<option value="">使用默认模型</option>';

            // 从 agents.defaults.models 获取模型列表
            const modelMap = agents.defaults.models || {};
            for (const [modelId, conf] of Object.entries(modelMap)) {
                const label = conf.alias ? `${conf.alias} (${modelId})` : modelId;
                sel.innerHTML += `<option value="${escapeHtml(modelId)}">${escapeHtml(label)}</option>`;
            }
        }

        function initAgentForm() {
            // Agent ID 输入时实时预览工作区路径
            document.getElementById('agent-id').addEventListener('input', (e) => {
                const id = e.target.value.trim();
                const preview = document.getElementById('workspace-preview');
                if (id) {
                    preview.textContent = `~/.openclaw/agents/${id}/`;
                } else {
                    preview.textContent = '~/.openclaw/agents/<agent-id>/';
                }
            });

            document.getElementById('agent-form').addEventListener('submit', async (e) => {
                e.preventDefault();

                const originalId = document.getElementById('agent-id-original').value;
                const id = document.getElementById('agent-id').value.trim();
                const name = document.getElementById('agent-name').value.trim();
                const workspace = document.getElementById('agent-workspace').value.trim();
                const model = document.getElementById('agent-model').value;

                const isEdit = !!originalId;

                try {
                    let res, data;
                    if (isEdit) {
                        const payload = {};
                        if (name) payload.name = name;
                        if (workspace) payload.workspace = workspace;
                        if (model) payload.model = { primary: model };
                        res = await fetch(`/api/agents/${originalId}`, {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(payload)
                        });
                    } else {
                        if (!id) { showToast('Agent ID 不能为空', 'error'); return; }
                        res = await fetch('/api/agents', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({id, name: name || undefined, workspace: workspace || undefined, model: model || undefined})
                        });
                    }

                    data = await res.json();
                    if (data.success) {
                        showToast(isEdit ? 'Agent 已更新' : 'Agent 已创建', 'success');
                        closeAgentModal();
                        setTimeout(() => location.reload(), 800);
                    } else {
                        showToast(data.error || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
            });
        }

        async function deleteAgent(agentId) {
            if (!confirm(`确定删除 Agent "${agentId}"？此操作不可恢复。`)) return;
            try {
                const res = await fetch(`/api/agents/${agentId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('Agent 已删除', 'success');
                    setTimeout(() => location.reload(), 500);
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        // ---- Bot List ----
        function renderBots() {
            const container = document.getElementById('bot-list');
            if (bots.length === 0) {
                container.innerHTML = '<p class="empty-state">暂无 Bot 账号，点击上方"添加 Bot"开始配置</p>';
                return;
            }

            container.innerHTML = bots.map(bot => `
                <div class="card ${bot.enabled ? '' : 'card-disabled'}">
                    <div class="card-header">
                        <h3>${escapeHtml(bot.name)}</h3>
                        <span class="badge ${bot.enabled ? 'badge-ok' : 'badge-disabled'}">${bot.enabled ? '启用' : '禁用'}</span>
                    </div>
                    <div class="card-body">
                        <div class="info-row">
                            <span class="label">App ID:</span>
                            <code>${escapeHtml(bot.appId)}</code>
                        </div>
                        <div class="info-row">
                            <span class="label">Secret:</span>
                            <code>${escapeHtml(bot.appSecret_masked)}</code>
                        </div>
                        <div class="info-row">
                            <span class="label">dmPolicy:</span>
                            <span>${bot.dmPolicy}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">groupPolicy:</span>
                            <span>${bot.groupPolicy}</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button onclick="editBot('${escapeJs(bot.name)}')" class="btn btn-sm">编辑</button>
                        <button onclick="toggleBot('${escapeJs(bot.name)}', ${!bot.enabled})" class="btn btn-sm ${bot.enabled ? 'btn-warning' : 'btn-success'}">
                            ${bot.enabled ? '禁用' : '启用'}
                        </button>
                        <button onclick="deleteBot('${escapeJs(bot.name)}')" class="btn btn-sm btn-danger">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // ---- Bot Modal ----
        function showAddBotModal() {
            document.getElementById('bot-modal-title').textContent = '添加 Bot';
            document.getElementById('bot-form').reset();
            document.getElementById('bot-name-original').value = '';
            document.getElementById('bot-appSecret').required = true;
            document.getElementById('bot-modal').style.display = 'flex';
        }

        function editBot(name) {
            const bot = bots.find(b => b.name === name);
            if (!bot) return;

            document.getElementById('bot-modal-title').textContent = '编辑 Bot';
            document.getElementById('bot-name-original').value = name;
            document.getElementById('bot-name').value = name;
            document.getElementById('bot-appId').value = bot.appId;
            document.getElementById('bot-appSecret').value = '';
            document.getElementById('bot-appSecret').required = false;
            document.getElementById('bot-dmPolicy').value = bot.dmPolicy;
            document.getElementById('bot-groupPolicy').value = bot.groupPolicy;
            document.getElementById('bot-webhookPath').value = bot.webhookPath || '/feishu/events';
            document.getElementById('bot-modal').style.display = 'flex';
        }

        function closeBotModal() {
            document.getElementById('bot-modal').style.display = 'none';
        }

        function initBotForm() {
            document.getElementById('bot-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const originalName = document.getElementById('bot-name-original').value;
                const name = document.getElementById('bot-name').value.trim();
                const appId = document.getElementById('bot-appId').value.trim();
                const appSecret = document.getElementById('bot-appSecret').value.trim();
                const dmPolicy = document.getElementById('bot-dmPolicy').value;
                const groupPolicy = document.getElementById('bot-groupPolicy').value;
                const webhookPath = document.getElementById('bot-webhookPath').value.trim();

                if (!name || !appId) {
                    showToast('名称和 App ID 不能为空', 'error');
                    return;
                }

                const isEdit = !!originalName;
                
                try {
                    let res, data;

                    if (isEdit) {
                        const payload = { appId, dmPolicy, groupPolicy, webhookPath };
                        if (appSecret) payload.appSecret = appSecret;
                        res = await fetch(`/api/bots/${originalName}`, {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(payload)
                        });
                    } else {
                        if (!appSecret) {
                            showToast('新添加 Bot 需要填写 App Secret', 'error');
                            return;
                        }
                        res = await fetch('/api/bots', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({name, appId, appSecret, dmPolicy, groupPolicy, webhookPath})
                        });
                    }

                    data = await res.json();
                    if (data.success) {
                        showToast(isEdit ? 'Bot 已更新' : 'Bot 已添加', 'success');
                        closeBotModal();
                        setTimeout(() => location.reload(), 800);
                    } else {
                        showToast(data.error || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
            });
        }

        async function toggleBot(name, enable) {
            try {
                const res = await fetch(`/api/bots/${name}/${enable ? 'enable' : 'disable'}`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast(`Bot 已${enable ? '启用' : '禁用'}`, 'success');
                    setTimeout(() => location.reload(), 500);
                } else {
                    showToast(data.error || '操作失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        async function deleteBot(name) {
            if (!confirm(`确定删除 Bot "${name}"？此操作不可恢复。`)) return;
            try {
                const res = await fetch(`/api/bots/${name}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('Bot 已删除', 'success');
                    setTimeout(() => location.reload(), 500);
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        // ---- Bindings ----
        function renderBindings() {
            const container = document.getElementById('binding-list');
            if (bindings.length === 0) {
                container.innerHTML = '<p class="empty-state">暂无绑定路由，点击上方"添加绑定"创建 Agent → Bot 路由</p>';
                return;
            }

            container.innerHTML = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Agent ID</th>
                            <th>Bot Account ID</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${bindings.map(b => `
                            <tr>
                                <td><code>${escapeHtml(b.agentId)}</code></td>
                                <td><code>${escapeHtml(b.match && b.match.accountId || '')}</code></td>
                                <td>
                                    <button onclick="deleteBinding('${escapeJs(b.agentId)}')" class="btn btn-sm btn-danger">移除</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function showAddBindingModal() {
            // Populate agent dropdown
            const agentSelect = document.getElementById('binding-agentId');
            agentSelect.innerHTML = '<option value="">选择 Agent...</option>';
            agents.list.forEach(a => {
                agentSelect.innerHTML += `<option value="${escapeHtml(a.id)}">${escapeHtml(a.name || a.id)}</option>`;
            });

            // Populate bot dropdown
            const botSelect = document.getElementById('binding-accountId');
            botSelect.innerHTML = '<option value="">选择 Bot...</option>';
            bots.forEach(b => {
                botSelect.innerHTML += `<option value="${escapeHtml(b.name)}">${escapeHtml(b.name)} (${escapeHtml(b.appId)})</option>`;
            });

            document.getElementById('binding-modal').style.display = 'flex';
        }

        function closeBindingModal() {
            document.getElementById('binding-modal').style.display = 'none';
        }

        function initBindingForm() {
            document.getElementById('binding-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const agentId = document.getElementById('binding-agentId').value.trim();
                const accountId = document.getElementById('binding-accountId').value.trim();

                if (!agentId || !accountId) {
                    showToast('请选择 Agent 和 Bot', 'error');
                    return;
                }

                try {
                    const res = await fetch('/api/bindings', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({agentId, accountId})
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast('绑定已保存', 'success');
                        closeBindingModal();
                        setTimeout(() => location.reload(), 800);
                    } else {
                        showToast(data.error || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
            });
        }

        async function deleteBinding(agentId) {
            if (!confirm(`确定移除 Agent "${agentId}" 的绑定？`)) return;
            try {
                const res = await fetch(`/api/bindings/${agentId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('绑定已移除', 'success');
                    setTimeout(() => location.reload(), 500);
                } else {
                    showToast(data.error || '操作失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        // ---- Info Tab ----
        function renderInfo() {
            // Models
            const modelEl = document.getElementById('model-info');
            if (models && Object.keys(models).length > 0) {
                const modelHtml = Object.entries(models).map(([name, conf]) => `
                    <div class="model-item">
                        <strong>${escapeHtml(name)}</strong>
                        ${conf.provider ? ` → ${escapeHtml(conf.provider)}` : ''}
                    </div>
                `).join('');
                modelEl.innerHTML = modelHtml;
            } else {
                modelEl.innerHTML = '<p class="empty-state">未找到模型配置</p>';
            }

            // Agents
            const agentEl = document.getElementById('agent-info');
            const defaultWs = agents.defaults && agents.defaults.workspace;
            agentEl.innerHTML = `
                <p><strong>默认工作区:</strong> <code>${escapeHtml(defaultWs || '未配置')}</code></p>
                <p><strong>默认模型:</strong> <code>${escapeHtml(agents.defaults?.model?.primary || '未配置')}</code></p>
                <p><strong>Agent 数量:</strong> ${agents.list ? agents.list.length : 0}</p>
                <details>
                    <summary>Agent 列表</summary>
                    <ul>
                        ${(agents.list || []).map(a => `
                            <li><code>${escapeHtml(a.id)}</code>${a.isDefault ? ' (默认)' : ''} → ${escapeHtml(a.workspace || '使用默认工作区')}</li>
                        `).join('')}
                    </ul>
                </details>
            `;
        }

        // ---- Tabs ----
        function initTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                });
            });
        }

        // ---- Agent Core Files Editor ----
        let currentFileAgent = null;
        let currentFileName = null;
        let fileData = [];
        let originalContents = {};

        async function editAgentFiles(agentId) {
            currentFileAgent = agentId;
            document.getElementById('files-modal-title').textContent = `编辑核心文件 - ${agentId}`;
            document.getElementById('file-editor').value = '';
            document.getElementById('file-desc').textContent = '';
            document.getElementById('file-status').textContent = '加载中...';

            try {
                const res = await fetch(`/api/agents/${agentId}/files`);
                fileData = await res.json();

                if (fileData.error) {
                    showToast(fileData.error, 'error');
                    return;
                }

                // 渲染文件标签
                const tabsEl = document.getElementById('file-tabs');
                tabsEl.innerHTML = fileData.map((f, i) => `
                    <button class="file-tab ${f.exists ? '' : 'file-tab-empty'} ${i === 0 ? 'active' : ''}" 
                            onclick="switchFileTab(${i})" data-index="${i}">
                        ${f.exists ? '📄' : '📝'} ${escapeHtml(f.filename)}
                        ${f.required ? '<span class="file-required">*</span>' : ''}
                    </button>
                `).join('');

                // 记住原始内容
                originalContents = {};
                fileData.forEach(f => { originalContents[f.filename] = f.content; });

                // 默认选中第一个
                switchFileTab(0);

            } catch (e) {
                showToast('加载文件失败: ' + e.message, 'error');
                return;
            }

            document.getElementById('files-modal').style.display = 'flex';
        }

        function switchFileTab(index) {
            const f = fileData[index];
            if (!f) return;

            currentFileName = f.filename;

            // 更新标签激活状态
            document.querySelectorAll('.file-tab').forEach((tab, i) => {
                tab.classList.toggle('active', i === index);
            });

            // 更新编辑器
            document.getElementById('file-editor').value = f.content;
            document.getElementById('file-desc').textContent = f.desc;
            document.getElementById('file-status').textContent = f.exists ? '已存在' : '未创建';
            document.getElementById('file-status').className = 'file-status ' + (f.exists ? 'status-exists' : 'status-new');
        }

        async function saveCurrentFile() {
            if (!currentFileAgent || !currentFileName) return;

            const content = document.getElementById('file-editor').value;

            try {
                const res = await fetch(`/api/agents/${currentFileAgent}/files/${currentFileName}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content})
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`${currentFileName} 已保存`, 'success');
                    originalContents[currentFileName] = content;
                    // 更新文件状态
                    const f = fileData.find(x => x.filename === currentFileName);
                    if (f) { f.exists = true; f.content = content; }
                    // 更新标签状态
                    const tabIndex = fileData.indexOf(f);
                    document.querySelectorAll('.file-tab')[tabIndex]?.classList.remove('file-tab-empty');
                    document.getElementById('file-status').textContent = '已存在';
                    document.getElementById('file-status').className = 'file-status status-exists';
                } else {
                    showToast(data.error || '保存失败', 'error');
                }
            } catch (e) {
                showToast('保存失败: ' + e.message, 'error');
            }
        }

        async function loadTemplate() {
            if (!currentFileAgent || !currentFileName) return;

            const editorContent = document.getElementById('file-editor').value.trim();
            if (editorContent) {
                if (!confirm('当前文件有内容，加载模板会覆盖。确定？')) return;
            }

            try {
                const res = await fetch(`/api/agents/${currentFileAgent}/files/${currentFileName}/template`);
                const data = await res.json();
                if (data.content !== undefined) {
                    document.getElementById('file-editor').value = data.content;
                    showToast(`已加载 ${currentFileName} 模板`, 'info');
                } else {
                    showToast('无可用模板', 'error');
                }
            } catch (e) {
                showToast('加载模板失败: ' + e.message, 'error');
            }
        }

        function closeFilesModal() {
            document.getElementById('files-modal').style.display = 'none';
            currentFileAgent = null;
            currentFileName = null;
        }

        // ---- Utils ----
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeJs(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast toast-' + type;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
