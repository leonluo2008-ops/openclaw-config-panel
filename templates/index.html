<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Config Panel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🦞 OpenClaw Config Panel</h1>
            <div class="header-actions">
                <span id="service-status" class="status-badge">检测中...</span>
                <button onclick="restartService()" class="btn btn-sm">重启服务</button>
                <button onclick="backupConfig()" class="btn btn-sm btn-secondary">备份配置</button>
            </div>
        </header>

        <main>
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="bots">Bot 账号</button>
                <button class="tab" data-tab="bindings">Agent 绑定</button>
                <button class="tab" data-tab="models">模型配置</button>
                <button class="tab" data-tab="info">配置概览</button>
            </div>

            <!-- Tab: Bots -->
            <div id="tab-bots" class="tab-content active">
                <div class="section-header">
                    <h2>飞书 Bot 账号</h2>
                    <button onclick="showAddBotModal()" class="btn btn-primary">+ 添加 Bot</button>
                </div>

                <div id="bot-list" class="card-grid">
                    <!-- Bot cards rendered here by JS -->
                </div>
            </div>

            <!-- Tab: Bindings -->
            <div id="tab-bindings" class="tab-content">
                <div class="section-header">
                    <h2>Agent → Bot 绑定路由</h2>
                    <button onclick="showAddBindingModal()" class="btn btn-primary">+ 添加绑定</button>
                </div>

                <div id="binding-list" class="binding-list">
                    <!-- Bindings rendered here by JS -->
                </div>
            </div>

            <!-- Tab: Models -->
            <div id="tab-models" class="tab-content">
                <div class="models-layout">
                    <!-- Left: Provider List -->
                    <div class="models-sidebar">
                        <div class="section-header">
                            <h3>模型服务商</h3>
                            <button onclick="showAddProviderModal()" class="btn btn-sm btn-primary">+ 添加</button>
                        </div>
                        <div id="provider-list" class="provider-list">
                            <!-- Providers rendered here -->
                        </div>
                    </div>

                    <!-- Right: Provider Detail / Default Model -->
                    <div class="models-main">
                        <!-- Provider Detail -->
                        <div id="provider-detail" class="provider-detail" style="display:none;">
                            <div class="section-header">
                                <h3 id="provider-detail-title">Provider 详情</h3>
                                <div class="detail-actions">
                                    <button onclick="showEditProviderModal()" class="btn btn-sm">编辑</button>
                                    <button onclick="deleteCurrentProvider()" class="btn btn-sm btn-danger">删除</button>
                                </div>
                            </div>
                            <div class="detail-info">
                                <div class="info-row">
                                    <span class="label">Base URL:</span>
                                    <code id="provider-baseUrl"></code>
                                </div>
                                <div class="info-row">
                                    <span class="label">API Type:</span>
                                    <span id="provider-api"></span>
                                </div>
                                <div class="info-row">
                                    <span class="label">API Key:</span>
                                    <code id="provider-apiKey"></code>
                                </div>
                                <div class="info-row">
                                    <span class="label">AuthHeader:</span>
                                    <span id="provider-authHeader"></span>
                                </div>
                            </div>

                            <!-- Models in this Provider -->
                            <div class="models-section">
                                <div class="section-header">
                                    <h4>模型列表</h4>
                                    <button onclick="showAddModelModal()" class="btn btn-sm btn-primary">+ 添加模型</button>
                                </div>
                                <div id="provider-models-list" class="model-list">
                                    <!-- Models rendered here -->
                                </div>
                            </div>
                        </div>

                        <!-- No Provider Selected -->
                        <div id="provider-empty" class="empty-state">
                            <p>从左侧选择一个服务商查看详情</p>
                        </div>

                        <!-- Default Model Selection -->
                        <div class="default-model-section">
                            <div class="section-header">
                                <h3>默认模型选择</h3>
                            </div>
                            <div class="default-model-form">
                                <div class="form-group">
                                    <label>主模型 (Primary)</label>
                                    <select id="default-primary">
                                        <option value="">选择主模型...</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>备用模型 (Fallbacks)</label>
                                    <div id="fallback-checkboxes" class="checkbox-group">
                                        <!-- Fallback checkboxes rendered here -->
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button onclick="saveDefaultModel()" class="btn btn-primary">保存默认模型</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab: Info -->
            <div id="tab-info" class="tab-content">
                <div class="section-header">
                    <h2>配置概览</h2>
                </div>

                <div class="info-section">
                    <h3>模型配置</h3>
                    <div id="model-info" class="info-box">
                        <!-- Models rendered here by JS -->
                    </div>
                </div>

                <div class="info-section">
                    <h3>Agent 工作区</h3>
                    <div id="agent-info" class="info-box">
                        <!-- Agents rendered here by JS -->
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>OpenClaw Config Panel · 配置文件: ~/.openclaw/openclaw.json</p>
        </footer>
    </div>

    <!-- Modal: Add/Edit Bot -->
    <div id="bot-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="bot-modal-title">添加 Bot</h3>
                <button onclick="closeBotModal()" class="close">&times;</button>
            </div>
            <form id="bot-form">
                <input type="hidden" id="bot-name-original">
                <div class="form-group">
                    <label>Bot 名称（唯一标识）</label>
                    <input type="text" id="bot-name" placeholder="例如: my-agent-bot" required>
                </div>
                <div class="form-group">
                    <label>App ID</label>
                    <input type="text" id="bot-appId" placeholder="cli_xxxxxxxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label>App Secret</label>
                    <input type="password" id="bot-appSecret" placeholder="填写后自动保存" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>dmPolicy（私聊策略）</label>
                        <select id="bot-dmPolicy">
                            <option value="open">open - 任何人可私聊</option>
                            <option value="pairing">pairing - 需配对码</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>groupPolicy（群聊策略）</label>
                        <select id="bot-groupPolicy">
                            <option value="closed">closed - 需明确允许</option>
                            <option value="open">open - 所有人可用</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>webhookPath</label>
                    <input type="text" id="bot-webhookPath" value="/feishu/events">
                </div>
                <div class="form-actions">
                    <button type="button" onclick="closeBotModal()" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add Binding -->
    <div id="binding-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加 Agent → Bot 绑定</h3>
                <button onclick="closeBindingModal()" class="close">&times;</button>
            </div>
            <form id="binding-form">
                <div class="form-group">
                    <label>Agent ID</label>
                    <select id="binding-agentId">
                        <option value="">选择 Agent...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>绑定到 Bot（accountId）</label>
                    <select id="binding-accountId">
                        <option value="">选择 Bot...</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" onclick="closeBindingModal()" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add/Edit Provider -->
    <div id="provider-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="provider-modal-title">添加服务商</h3>
                <button onclick="closeProviderModal()" class="close">&times;</button>
            </div>
            <form id="provider-form">
                <input type="hidden" id="provider-name-original">
                <div class="form-group">
                    <label>服务商名称</label>
                    <input type="text" id="provider-name" placeholder="例如: minimax, zai, openai" required>
                </div>
                <div class="form-group">
                    <label>Base URL</label>
                    <input type="text" id="provider-baseUrl" placeholder="https://api.minimax.io/anthropic" required>
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="provider-apiKey" placeholder="留空则不修改">
                </div>
                <div class="form-group">
                    <label>API 类型</label>
                    <select id="provider-api">
                        <option value="anthropic-messages">anthropic-messages</option>
                        <option value="openai-completions">openai-completions</option>
                        <option value="openai-responses">openai-responses</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="provider-authHeader"> 使用 Auth Header
                    </label>
                </div>
                <div class="form-actions">
                    <button type="button" onclick="closeProviderModal()" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add/Edit Model -->
    <div id="model-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="model-modal-title">添加模型</h3>
                <button onclick="closeModelModal()" class="close">&times;</button>
            </div>
            <form id="model-form">
                <input type="hidden" id="model-provider-name">
                <input type="hidden" id="model-id-original">
                <div class="form-group">
                    <label>模型 ID</label>
                    <input type="text" id="model-id" placeholder="例如: MiniMax-M2.7" required>
                </div>
                <div class="form-group">
                    <label>显示名称</label>
                    <input type="text" id="model-name" placeholder="例如: MiniMax M2.7">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>支持推理</label>
                        <select id="model-reasoning">
                            <option value="false">否</option>
                            <option value="true">是</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>输入类型</label>
                        <select id="model-input">
                            <option value='["text"]'>仅文本</option>
                            <option value='["text","image"]'>文本+图片</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>上下文窗口</label>
                        <input type="number" id="model-contextWindow" value="200000">
                    </div>
                    <div class="form-group">
                        <label>最大输出</label>
                        <input type="number" id="model-maxTokens" value="8192">
                    </div>
                </div>
                <details class="cost-details">
                    <summary>成本配置（可选）</summary>
                    <div class="cost-fields">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Input Cost</label>
                                <input type="number" id="model-cost-input" value="0" step="0.001">
                            </div>
                            <div class="form-group">
                                <label>Output Cost</label>
                                <input type="number" id="model-cost-output" value="0" step="0.001">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Cache Read</label>
                                <input type="number" id="model-cost-cacheRead" value="0" step="0.001">
                            </div>
                            <div class="form-group">
                                <label>Cache Write</label>
                                <input type="number" id="model-cost-cacheWrite" value="0" step="0.001">
                            </div>
                        </div>
                    </div>
                </details>
                <div class="form-actions">
                    <button type="button" onclick="closeModelModal()" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script>
        // ---- Data from server ----
        const bots = {{ bots | tojson }};
        const bindings = {{ bindings | tojson }};
        const agents = {{ agents | tojson }};
        const models = {{ models | tojson }};
        const modelProviders = {{ model_providers | tojson }};
        const agentModels = {{ agent_models | tojson }};
        const defaultModel = {{ default_model | tojson }};
        const serviceOk = {{ 'true' if service_ok else 'false' }};

        // Current state
        let currentProvider = null;

        // ---- Init ----
        document.addEventListener('DOMContentLoaded', () => {
            renderServiceStatus();
            renderBots();
            renderBindings();
            renderProviders();
            renderDefaultModel();
            renderInfo();
            initTabs();
            initBotForm();
            initBindingForm();
            initProviderForm();
            initModelForm();
        });

        // ---- Service Status ----
        function renderServiceStatus() {
            const el = document.getElementById('service-status');
            if (serviceOk) {
                el.textContent = '● 运行中';
                el.className = 'status-badge status-ok';
            } else {
                el.textContent = '○ 已停止';
                el.className = 'status-badge status-error';
            }
        }

        async function restartService() {
            showToast('正在重启服务...', 'info');
            try {
                const res = await fetch('/api/service/restart', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast('服务已重启', 'success');
                    setTimeout(() => location.reload(), 1500);
                } else {
                    showToast('重启失败: ' + data.error, 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        async function backupConfig() {
            try {
                const res = await fetch('/api/backup', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast('备份已保存', 'success');
                }
            } catch (e) {
                showToast('备份失败: ' + e.message, 'error');
            }
        }

        // ---- Bot List ----
        function renderBots() {
            const container = document.getElementById('bot-list');
            if (bots.length === 0) {
                container.innerHTML = '<p class="empty-state">暂无 Bot 账号，点击上方"添加 Bot"开始配置</p>';
                return;
            }

            container.innerHTML = bots.map(bot => `
                <div class="card ${bot.enabled ? '' : 'card-disabled'}">
                    <div class="card-header">
                        <h3>${escapeHtml(bot.name)}</h3>
                        <span class="badge ${bot.enabled ? 'badge-ok' : 'badge-disabled'}">${bot.enabled ? '启用' : '禁用'}</span>
                    </div>
                    <div class="card-body">
                        <div class="info-row">
                            <span class="label">App ID:</span>
                            <code>${escapeHtml(bot.appId)}</code>
                        </div>
                        <div class="info-row">
                            <span class="label">Secret:</span>
                            <code>${escapeHtml(bot.appSecret_masked)}</code>
                        </div>
                        <div class="info-row">
                            <span class="label">dmPolicy:</span>
                            <span>${bot.dmPolicy}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">groupPolicy:</span>
                            <span>${bot.groupPolicy}</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button onclick="editBot('${escapeJs(bot.name)}')" class="btn btn-sm">编辑</button>
                        <button onclick="toggleBot('${escapeJs(bot.name)}', ${!bot.enabled})" class="btn btn-sm ${bot.enabled ? 'btn-warning' : 'btn-success'}">
                            ${bot.enabled ? '禁用' : '启用'}
                        </button>
                        <button onclick="deleteBot('${escapeJs(bot.name)}')" class="btn btn-sm btn-danger">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // ---- Bot Modal ----
        function showAddBotModal() {
            document.getElementById('bot-modal-title').textContent = '添加 Bot';
            document.getElementById('bot-form').reset();
            document.getElementById('bot-name-original').value = '';
            document.getElementById('bot-appSecret').required = true;
            document.getElementById('bot-modal').style.display = 'flex';
        }

        function editBot(name) {
            const bot = bots.find(b => b.name === name);
            if (!bot) return;

            document.getElementById('bot-modal-title').textContent = '编辑 Bot';
            document.getElementById('bot-name-original').value = name;
            document.getElementById('bot-name').value = name;
            document.getElementById('bot-appId').value = bot.appId;
            document.getElementById('bot-appSecret').value = '';
            document.getElementById('bot-appSecret').required = false;
            document.getElementById('bot-dmPolicy').value = bot.dmPolicy;
            document.getElementById('bot-groupPolicy').value = bot.groupPolicy;
            document.getElementById('bot-webhookPath').value = bot.webhookPath || '/feishu/events';
            document.getElementById('bot-modal').style.display = 'flex';
        }

        function closeBotModal() {
            document.getElementById('bot-modal').style.display = 'none';
        }

        function initBotForm() {
            document.getElementById('bot-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const originalName = document.getElementById('bot-name-original').value;
                const name = document.getElementById('bot-name').value.trim();
                const appId = document.getElementById('bot-appId').value.trim();
                const appSecret = document.getElementById('bot-appSecret').value.trim();
                const dmPolicy = document.getElementById('bot-dmPolicy').value;
                const groupPolicy = document.getElementById('bot-groupPolicy').value;
                const webhookPath = document.getElementById('bot-webhookPath').value.trim();

                if (!name || !appId) {
                    showToast('名称和 App ID 不能为空', 'error');
                    return;
                }

                const isEdit = !!originalName;
                
                try {
                    let res, data;

                    if (isEdit) {
                        const payload = { appId, dmPolicy, groupPolicy, webhookPath };
                        if (appSecret) payload.appSecret = appSecret;
                        res = await fetch(`/api/bots/${originalName}`, {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(payload)
                        });
                    } else {
                        if (!appSecret) {
                            showToast('新添加 Bot 需要填写 App Secret', 'error');
                            return;
                        }
                        res = await fetch('/api/bots', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({name, appId, appSecret, dmPolicy, groupPolicy, webhookPath})
                        });
                    }

                    data = await res.json();
                    if (data.success) {
                        showToast(isEdit ? 'Bot 已更新' : 'Bot 已添加', 'success');
                        closeBotModal();
                        setTimeout(() => location.reload(), 800);
                    } else {
                        showToast(data.error || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
            });
        }

        async function toggleBot(name, enable) {
            try {
                const res = await fetch(`/api/bots/${name}/${enable ? 'enable' : 'disable'}`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast(`Bot 已${enable ? '启用' : '禁用'}`, 'success');
                    setTimeout(() => location.reload(), 500);
                } else {
                    showToast(data.error || '操作失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        async function deleteBot(name) {
            if (!confirm(`确定删除 Bot "${name}"？此操作不可恢复。`)) return;
            try {
                const res = await fetch(`/api/bots/${name}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('Bot 已删除', 'success');
                    setTimeout(() => location.reload(), 500);
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        // ---- Bindings ----
        function renderBindings() {
            const container = document.getElementById('binding-list');
            if (bindings.length === 0) {
                container.innerHTML = '<p class="empty-state">暂无绑定路由，点击上方"添加绑定"创建 Agent → Bot 路由</p>';
                return;
            }

            container.innerHTML = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Agent ID</th>
                            <th>Bot Account ID</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${bindings.map(b => `
                            <tr>
                                <td><code>${escapeHtml(b.agentId)}</code></td>
                                <td><code>${escapeHtml(b.match && b.match.accountId || '')}</code></td>
                                <td>
                                    <button onclick="deleteBinding('${escapeJs(b.agentId)}')" class="btn btn-sm btn-danger">移除</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function showAddBindingModal() {
            // Populate agent dropdown
            const agentSelect = document.getElementById('binding-agentId');
            agentSelect.innerHTML = '<option value="">选择 Agent...</option>';
            agents.list.forEach(a => {
                agentSelect.innerHTML += `<option value="${escapeHtml(a.id)}">${escapeHtml(a.name || a.id)}</option>`;
            });

            // Populate bot dropdown
            const botSelect = document.getElementById('binding-accountId');
            botSelect.innerHTML = '<option value="">选择 Bot...</option>';
            bots.forEach(b => {
                botSelect.innerHTML += `<option value="${escapeHtml(b.name)}">${escapeHtml(b.name)} (${escapeHtml(b.appId)})</option>`;
            });

            document.getElementById('binding-modal').style.display = 'flex';
        }

        function closeBindingModal() {
            document.getElementById('binding-modal').style.display = 'none';
        }

        function initBindingForm() {
            document.getElementById('binding-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const agentId = document.getElementById('binding-agentId').value.trim();
                const accountId = document.getElementById('binding-accountId').value.trim();

                if (!agentId || !accountId) {
                    showToast('请选择 Agent 和 Bot', 'error');
                    return;
                }

                try {
                    const res = await fetch('/api/bindings', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({agentId, accountId})
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast('绑定已保存', 'success');
                        closeBindingModal();
                        setTimeout(() => location.reload(), 800);
                    } else {
                        showToast(data.error || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
            });
        }

        async function deleteBinding(agentId) {
            if (!confirm(`确定移除 Agent "${agentId}" 的绑定？`)) return;
            try {
                const res = await fetch(`/api/bindings/${agentId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('绑定已移除', 'success');
                    setTimeout(() => location.reload(), 500);
                } else {
                    showToast(data.error || '操作失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        // =====================================================================
        // Models Tab
        // =====================================================================

        function renderProviders() {
            const container = document.getElementById('provider-list');
            const providerNames = Object.keys(modelProviders);
            
            if (providerNames.length === 0) {
                container.innerHTML = '<p class="empty-state">暂无服务商，请添加</p>';
                return;
            }

            container.innerHTML = providerNames.map(name => {
                const p = modelProviders[name];
                const modelCount = p.models ? p.models.length : 0;
                const isSelected = currentProvider === name;
                return `
                    <div class="provider-item ${isSelected ? 'selected' : ''}" onclick="selectProvider('${escapeJs(name)}')">
                        <div class="provider-name">${escapeHtml(name)}</div>
                        <div class="provider-meta">${modelCount} 个模型</div>
                    </div>
                `;
            }).join('');
        }

        function selectProvider(name) {
            currentProvider = name;
            renderProviders();
            renderProviderDetail(name);
        }

        function renderProviderDetail(name) {
            const detail = document.getElementById('provider-detail');
            const empty = document.getElementById('provider-empty');
            
            if (!name || !modelProviders[name]) {
                detail.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            detail.style.display = 'block';
            empty.style.display = 'none';

            const p = modelProviders[name];
            document.getElementById('provider-detail-title').textContent = name;
            document.getElementById('provider-baseUrl').textContent = p.baseUrl || '';
            document.getElementById('provider-api').textContent = p.api || 'anthropic-messages';
            document.getElementById('provider-apiKey').textContent = p.apiKey_masked || '(未设置)';
            document.getElementById('provider-authHeader').textContent = p.authHeader ? '是' : '否';

            // Render models
            const modelsList = document.getElementById('provider-models-list');
            const models_data = p.models || [];
            
            if (models_data.length === 0) {
                modelsList.innerHTML = '<p class="empty-state">暂无模型，点击"添加模型"添加</p>';
            } else {
                modelsList.innerHTML = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>模型 ID</th>
                                <th>名称</th>
                                <th>推理</th>
                                <th>上下文</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${models_data.map(m => `
                                <tr>
                                    <td><code>${escapeHtml(m.id)}</code></td>
                                    <td>${escapeHtml(m.name || m.id)}</td>
                                    <td>${m.reasoning ? '✓' : '✗'}</td>
                                    <td>${(m.contextWindow || 200000).toLocaleString()}</td>
                                    <td>
                                        <button onclick="editModel('${escapeJs(name)}', '${escapeJs(m.id)}')" class="btn btn-sm">编辑</button>
                                        <button onclick="deleteModel('${escapeJs(name)}', '${escapeJs(m.id)}')" class="btn btn-sm btn-danger">删除</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
        }

        // ---- Provider Modal ----
        function showAddProviderModal() {
            document.getElementById('provider-modal-title').textContent = '添加服务商';
            document.getElementById('provider-form').reset();
            document.getElementById('provider-name-original').value = '';
            document.getElementById('provider-name').required = true;
            document.getElementById('provider-apiKey').required = false;
            document.getElementById('provider-modal').style.display = 'flex';
        }

        function showEditProviderModal() {
            if (!currentProvider) return;
            const p = modelProviders[currentProvider];
            
            document.getElementById('provider-modal-title').textContent = '编辑服务商';
            document.getElementById('provider-name-original').value = currentProvider;
            document.getElementById('provider-name').value = currentProvider;
            document.getElementById('provider-name').required = true;
            document.getElementById('provider-baseUrl').value = p.baseUrl || '';
            document.getElementById('provider-apiKey').value = '';
            document.getElementById('provider-apiKey').required = false;
            document.getElementById('provider-api').value = p.api || 'anthropic-messages';
            document.getElementById('provider-authHeader').checked = p.authHeader || false;
            document.getElementById('provider-modal').style.display = 'flex';
        }

        function closeProviderModal() {
            document.getElementById('provider-modal').style.display = 'none';
        }

        function initProviderForm() {
            document.getElementById('provider-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const originalName = document.getElementById('provider-name-original').value;
                const name = document.getElementById('provider-name').value.trim();
                const baseUrl = document.getElementById('provider-baseUrl').value.trim();
                const apiKey = document.getElementById('provider-apiKey').value.trim();
                const api = document.getElementById('provider-api').value;
                const authHeader = document.getElementById('provider-authHeader').checked;

                if (!name || !baseUrl) {
                    showToast('名称和 Base URL 不能为空', 'error');
                    return;
                }

                const isEdit = !!originalName;
                
                try {
                    let res, data;
                    const payload = { baseUrl, api, authHeader };
                    if (apiKey) payload.apiKey = apiKey;

                    if (isEdit) {
                        res = await fetch(`/api/models/providers/${originalName}`, {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(payload)
                        });
                    } else {
                        payload.name = name;
                        res = await fetch('/api/models/providers', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(payload)
                        });
                    }

                    data = await res.json();
                    if (data.success) {
                        showToast(isEdit ? '服务商已更新' : '服务商已添加', 'success');
                        closeProviderModal();
                        setTimeout(() => location.reload(), 800);
                    } else {
                        showToast(data.error || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
            });
        }

        async function deleteCurrentProvider() {
            if (!currentProvider) return;
            if (!confirm(`确定删除服务商 "${currentProvider}"？此操作不可恢复。`)) return;
            
            try {
                const res = await fetch(`/api/models/providers/${currentProvider}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('服务商已删除', 'success');
                    currentProvider = null;
                    setTimeout(() => location.reload(), 500);
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        // ---- Model Modal ----
        function showAddModelModal() {
            if (!currentProvider) {
                showToast('请先选择一个服务商', 'error');
                return;
            }
            
            document.getElementById('model-modal-title').textContent = '添加模型';
            document.getElementById('model-form').reset();
            document.getElementById('model-provider-name').value = currentProvider;
            document.getElementById('model-id-original').value = '';
            document.getElementById('model-id').required = true;
            document.getElementById('model-modal').style.display = 'flex';
        }

        function editModel(providerName, modelId) {
            const p = modelProviders[providerName];
            if (!p || !p.models) return;
            const m = p.models.find(m => m.id === modelId);
            if (!m) return;

            document.getElementById('model-modal-title').textContent = '编辑模型';
            document.getElementById('model-provider-name').value = providerName;
            document.getElementById('model-id-original').value = modelId;
            document.getElementById('model-id').value = m.id;
            document.getElementById('model-id').required = false;
            document.getElementById('model-name').value = m.name || '';
            document.getElementById('model-reasoning').value = String(m.reasoning || false);
            document.getElementById('model-input').value = JSON.stringify(m.input || ['text']);
            document.getElementById('model-contextWindow').value = m.contextWindow || 200000;
            document.getElementById('model-maxTokens').value = m.maxTokens || 8192;
            
            if (m.cost) {
                document.getElementById('model-cost-input').value = m.cost.input || 0;
                document.getElementById('model-cost-output').value = m.cost.output || 0;
                document.getElementById('model-cost-cacheRead').value = m.cost.cacheRead || 0;
                document.getElementById('model-cost-cacheWrite').value = m.cost.cacheWrite || 0;
            }
            
            document.getElementById('model-modal').style.display = 'flex';
        }

        function closeModelModal() {
            document.getElementById('model-modal').style.display = 'none';
        }

        function initModelForm() {
            document.getElementById('model-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const providerName = document.getElementById('model-provider-name').value;
                const originalId = document.getElementById('model-id-original').value;
                const id = document.getElementById('model-id').value.trim();
                const name = document.getElementById('model-name').value.trim() || id;
                const reasoning = document.getElementById('model-reasoning').value === 'true';
                const input = JSON.parse(document.getElementById('model-input').value);
                const contextWindow = parseInt(document.getElementById('model-contextWindow').value) || 200000;
                const maxTokens = parseInt(document.getElementById('model-maxTokens').value) || 8192;
                
                const cost = {
                    input: parseFloat(document.getElementById('model-cost-input').value) || 0,
                    output: parseFloat(document.getElementById('model-cost-output').value) || 0,
                    cacheRead: parseFloat(document.getElementById('model-cost-cacheRead').value) || 0,
                    cacheWrite: parseFloat(document.getElementById('model-cost-cacheWrite').value) || 0
                };

                if (!id) {
                    showToast('模型 ID 不能为空', 'error');
                    return;
                }

                const isEdit = !!originalId;
                
                try {
                    let res, data;
                    const payload = { id: originalId || id, name, reasoning, input, contextWindow, maxTokens, cost };

                    if (isEdit) {
                        res = await fetch(`/api/models/providers/${providerName}/models/${originalId}`, {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(payload)
                        });
                    } else {
                        res = await fetch(`/api/models/providers/${providerName}/models`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(payload)
                        });
                    }

                    data = await res.json();
                    if (data.success) {
                        showToast(isEdit ? '模型已更新' : '模型已添加', 'success');
                        closeModelModal();
                        setTimeout(() => location.reload(), 800);
                    } else {
                        showToast(data.error || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
            });
        }

        async function deleteModel(providerName, modelId) {
            if (!confirm(`确定删除模型 "${modelId}"？`)) return;
            
            try {
                const res = await fetch(`/api/models/providers/${providerName}/models/${modelId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('模型已删除', 'success');
                    setTimeout(() => location.reload(), 500);
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        // ---- Default Model ----
        function renderDefaultModel() {
            // Build list of all available models from all providers
            const allModels = [];
            for (const [providerName, p] of Object.entries(modelProviders)) {
                if (p.models) {
                    for (const m of p.models) {
                        allModels.push(`${providerName}/${m.id}`);
                    }
                }
            }

            // Primary select
            const primarySelect = document.getElementById('default-primary');
            primarySelect.innerHTML = '<option value="">选择主模型...</option>' +
                allModels.map(ref => {
                    const selected = defaultModel.primary === ref ? 'selected' : '';
                    return `<option value="${escapeHtml(ref)}" ${selected}>${escapeHtml(ref)}</option>`;
                }).join('');

            // Fallback checkboxes
            const fbContainer = document.getElementById('fallback-checkboxes');
            if (allModels.length === 0) {
                fbContainer.innerHTML = '<p class="empty-state">无可用模型</p>';
            } else {
                const currentFallbacks = defaultModel.fallbacks || [];
                fbContainer.innerHTML = allModels.map(ref => {
                    const checked = currentFallbacks.includes(ref) ? 'checked' : '';
                    return `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${escapeHtml(ref)}" ${checked}>
                            ${escapeHtml(ref)}
                        </label>
                    `;
                }).join('');
            }
        }

        async function saveDefaultModel() {
            const primary = document.getElementById('default-primary').value;
            
            if (!primary) {
                showToast('请选择主模型', 'error');
                return;
            }

            const fbCheckboxes = document.querySelectorAll('#fallback-checkboxes input[type="checkbox"]:checked');
            const fallbacks = Array.from(fbCheckboxes).map(cb => cb.value);

            try {
                const res = await fetch('/api/models/default', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ primary, fallbacks })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('默认模型已保存', 'success');
                    setTimeout(() => location.reload(), 800);
                } else {
                    showToast(data.error || '保存失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        // ---- Info Tab ----
        function renderInfo() {
            // Models
            const modelEl = document.getElementById('model-info');
            if (modelProviders && Object.keys(modelProviders).length > 0) {
                const modelHtml = Object.entries(modelProviders).map(([name, conf]) => {
                    const modelList = conf.models ? conf.models.map(m => 
                        `<li>${escapeHtml(m.id)} ${m.name ? '(' + escapeHtml(m.name) + ')' : ''}</li>`
                    ).join('') : '';
                    return `
                        <div class="model-item">
                            <strong>${escapeHtml(name)}</strong>
                            ${conf.baseUrl ? ` → ${escapeHtml(conf.baseUrl)}` : ''}
                            ${modelList ? `<ul>${modelList}</ul>` : ''}
                        </div>
                    `;
                }).join('');
                modelEl.innerHTML = modelHtml;
            } else {
                modelEl.innerHTML = '<p class="empty-state">未找到模型配置</p>';
            }

            // Agents
            const agentEl = document.getElementById('agent-info');
            const defaultWs = agents.defaults && agents.defaults.workspace;
            agentEl.innerHTML = `
                <p><strong>默认工作区:</strong> <code>${escapeHtml(defaultWs || '未配置')}</code></p>
                <p><strong>Agent 数量:</strong> ${agents.list ? agents.list.length : 0}</p>
                <details>
                    <summary>Agent 列表</summary>
                    <ul>
                        ${(agents.list || []).map(a => `
                            <li><code>${escapeHtml(a.id)}</code> → ${escapeHtml(a.workspace || '未配置')}</li>
                        `).join('')}
                    </ul>
                </details>
            `;
        }

        // ---- Tabs ----
        function initTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                });
            });
        }

        // ---- Utils ----
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeJs(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast toast-' + type;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
